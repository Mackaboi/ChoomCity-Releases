<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 144" role="img" aria-labelledby="title description">
  <title id="title">ChoomCity field diagnostics</title>
  <desc id="description">F10 opens the stats overlay for network health, frame timing, and session logs. The traces are decorative.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .signal-sweep { animation: signal-sweep 6s linear .2s infinite; }
      .timing-bars {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: timing-pulse 6s cubic-bezier(.77, 0, .175, 1) .2s infinite;
      }
    }

    @keyframes signal-sweep {
      0% { transform: translateX(0); opacity: 0; }
      4%, 21% { opacity: .8; }
      25%, 100% { transform: translateX(220px); opacity: 0; }
    }

    @keyframes timing-pulse {
      0%, 20%, 100% { transform: none; opacity: 1; }
      8% { transform: scaleY(.65); opacity: .45; }
    }
  </style>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#5ff6ed" stroke-opacity=".1"/>
    </pattern>
    <linearGradient id="signal-light">
      <stop stop-color="#5ff6ed" stop-opacity="0"/>
      <stop offset="1" stop-color="#5ff6ed" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="signal-window">
      <rect x="262" y="72" width="218" height="38"/>
    </clipPath>
  </defs>
  <path fill="#101421" stroke="#5ff6ed" stroke-width="2" d="M2 2h1084l32 32v108H32L2 112z"/>
  <path fill="url(#grid)" d="M12 12h1070l26 26v94H36l-24-24z"/>
  <path fill="#f8fa58" d="M35 27h184l17 17v65H52l-17-17z"/>
  <path fill="#5ff6ed" d="M262 32h12v4h-12zm280 0h12v4h-12zm280 0h12v4h-12z"/>
  <g font-family="Consolas, monospace">
    <text x="58" y="73" fill="#101421" font-size="42" font-weight="bold">F10</text>
    <text x="61" y="94" fill="#101421" font-size="16" font-weight="bold" letter-spacing="1">STATS OVERLAY</text>
    <g fill="#e4e5ee" font-size="20" letter-spacing="1">
      <text x="262" y="63">NETWORK HEALTH</text>
      <text x="542" y="63">FRAME TIMING</text>
      <text x="822" y="63">SESSION LOGS</text>
    </g>
  </g>
  <g clip-path="url(#signal-window)">
    <g class="signal-sweep" opacity="0">
      <path fill="url(#signal-light)" d="M232 72h30v38h-30z"/>
      <path stroke="#5ff6ed" d="M262 72v38"/>
    </g>
  </g>
  <path fill="none" stroke="#5ff6ed" stroke-width="2" d="M262 94h27l12-13 17 26 22-34 17 21h24l12-8 15 8h72"/>
  <path class="timing-bars" fill="#e3529b" d="M542 92h15v16h-15zm21-9h15v25h-15zm21 5h15v20h-15zm21-14h15v34h-15zm21 17h15v17h-15zm21-10h15v27h-15z"/>
  <path fill="none" stroke="#5ff6ed" stroke-width="2" d="M822 83h117m-117 12h81m-81 12h101m27 0h22"/>
  <path fill="none" stroke="#545063" d="M508 30v83m280-83v83"/>
</svg>
